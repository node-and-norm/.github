<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">Research program structure</title><desc id="desc">Revocation is the current study. Documentary methods, decision records and domain research retain separate evidence limits.</desc><rect width="400" height="440" fill="#F7F7F4"/><g font-family="Arial,Helvetica,sans-serif" fill="#191820"><text x="24" y="35" font-size="18" font-weight="700">Program structure</text><text x="24" y="60" font-size="13">Distinct roles. Evidence read on its own terms.</text><circle cx="36" cy="114" r="10"/><path d="M48 114H355" stroke="#191820" stroke-width="2"/><rect x="350" y="94" width="8" height="40" fill="#D7F59A" stroke="#191820"/><text x="60" y="103" font-size="17" font-weight="700">Current study: Revocation</text><text x="60" y="143" font-size="13">When permission ends, does action stop?</text><text x="24" y="185" font-size="12" fill="#5F5E6B">Independent validation remains open.</text><path d="M36 224l9 9-9 9-9-9z" fill="#5142D3"/><text x="60" y="232" font-size="16" font-weight="700">Documentary methods</text><text x="60" y="254" font-size="13">TAE, HIT and CEC</text><circle cx="36" cy="305" r="8" fill="none" stroke="#191820" stroke-width="2"/><text x="60" y="304" font-size="16" font-weight="700">Decision records</text><text x="60" y="326" font-size="13">GDI, RGDS and supporting research</text><path d="M36 367l10 16H26z" fill="#7B7A88"/><text x="60" y="380" font-size="16" font-weight="700">Domain research</text><text x="60" y="402" font-size="13">CDFI and Poenitentia</text></g></svg>