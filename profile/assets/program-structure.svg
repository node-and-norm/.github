<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Program structure: current study, documentary methods, decision records and domain research">
<title>Research program structure</title><desc>Revocation is the current study. Documentary methods, decision records and domain research retain their own evidence limits. Connections describe research roles, not validation.</desc><style>.k{fill:#191820}.i{fill:#5142D3}.m{fill:#5F5E6B}.t{font-family:Arial,Helvetica,sans-serif}.ln{stroke:#191820;stroke-width:2;fill:none;stroke-linecap:round}.da{stroke:#B9B8C2;stroke-dasharray:5 6}</style>
<rect width="960" height="330" fill="#F7F7F4"/>
<text class="t k" x="36" y="44" font-size="15" font-weight="700">Program structure</text>
<text class="t m" x="36" y="66" font-size="13">Distinct research roles, with evidence read on its own terms</text>
<line class="ln" x1="36" y1="150" x2="330" y2="150"/>
<rect x="326" y="118" width="9" height="64" rx="1" fill="#D7F59A" stroke="#191820" stroke-width="1.25"/>
<circle class="k" cx="60" cy="150" r="13"/><circle cx="60" cy="150" r="19" fill="none" stroke="#191820" stroke-opacity=".3" stroke-width="1.3"/>
<text class="t k" x="92" y="138" font-size="17" font-weight="700">Current study: Revocation</text>
<text class="t m" x="92" y="172" font-size="13">When permission ends,</text>
<text class="t m" x="92" y="190" font-size="13">does protected action stop?</text>
<line class="ln da" x1="344" y1="150" x2="924" y2="150"/>
<text class="t m" x="352" y="138" font-size="12.5">independent validation remains open</text>
<g transform="translate(400,206)"><polygon class="i" points="0,-10 10,0 0,10 -10,0"/><text class="t k" x="22" y="-2" font-size="14.5" font-weight="700">Documentary methods</text><text class="t m" x="22" y="17" font-size="12.5">TAE, HIT and CEC</text></g>
<g transform="translate(400,274)"><circle cx="0" cy="0" r="8" fill="#F7F7F4" stroke="#191820" stroke-width="2.2"/><text class="t k" x="22" y="-2" font-size="14.5" font-weight="700">Decision records</text><text class="t m" x="22" y="17" font-size="12.5">GDI, RGDS and supporting research</text></g>
<g transform="translate(700,206)"><polygon points="0,-9 9.5,7 -9.5,7" fill="#7B7A88"/><text class="t k" x="22" y="-2" font-size="14.5" font-weight="700">Domain research</text><text class="t m" x="22" y="17" font-size="12.5">CDFI and Poenitentia</text></g>
</svg>
